<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kalkulator sederhana, cepat, dan nyaman digunakan di semua perangkat."
    />
    <meta name="theme-color" content="#f4f5fa" />
    <title>Kalkulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="calculator" aria-label="Kalkulator">
        <div class="calculator-top">
          <div>
            <p class="calculator-label">KALKULATOR</p>
            <p class="calculator-caption">Perhitungan standar</p>
          </div>
          <span class="calculator-symbol" aria-hidden="true">＋</span>
        </div>

        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="display-expression" id="expression" aria-label="Ekspresi"></div>
          <output class="display-value" id="display">0</output>
        </div>

        <div class="keypad" id="calculator-keys" aria-label="Tombol kalkulator">
          <div class="keypad-utility-pair">
            <button class="key key--utility" type="button" data-action="clear" aria-label="Hapus semua">AC</button>
            <button class="key key--utility key--backspace" type="button" data-action="backspace" aria-label="Hapus satu angka" title="Hapus satu angka">⌫</button>
          </div>
          <button class="key key--utility" type="button" data-action="sign" aria-label="Ubah tanda">+/−</button>
          <button class="key key--utility" type="button" data-action="percent" aria-label="Persen">%</button>
          <button class="key key--operator" type="button" data-operator="/" aria-label="Bagi">÷</button>

          <button class="key" type="button" data-digit="7">7</button>
          <button class="key" type="button" data-digit="8">8</button>
          <button class="key" type="button" data-digit="9">9</button>
          <button class="key key--operator" type="button" data-operator="*" aria-label="Kali">×</button>

          <button class="key" type="button" data-digit="4">4</button>
          <button class="key" type="button" data-digit="5">5</button>
          <button class="key" type="button" data-digit="6">6</button>
          <button class="key key--operator" type="button" data-operator="-" aria-label="Kurang">−</button>

          <button class="key" type="button" data-digit="1">1</button>
          <button class="key" type="button" data-digit="2">2</button>
          <button class="key" type="button" data-digit="3">3</button>
          <button class="key key--operator" type="button" data-operator="+" aria-label="Tambah">+</button>

          <button class="key key--zero" type="button" data-digit="0">0</button>
          <button class="key" type="button" data-action="decimal" aria-label="Koma desimal">,</button>
          <button class="key key--equals" type="button" data-action="equals" aria-label="Hasil">=</button>
        </div>
        <p class="keyboard-hint"><span aria-hidden="true">⌨</span> Bisa juga pakai keyboard</p>
      </section>
    </main>
  </body>
</html>
